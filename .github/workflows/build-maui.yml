name: Build - MAUI apps

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  build-android:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src/MauiBlazor.UI/MauiBlazor.UI.Mobile/
    name: Android Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build MAUI Android
        run: dotnet publish -c Release -f net10.0-android --no-restore

      - name: Upload Android Artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: mauiblazor-android-ci-build
          path: src/MauiBlazor.UI/MauiBlazor.UI.Mobile/bin/Release/net10.0-android/publish

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src/MauiBlazor.UI/MauiBlazor.UI.Mobile/
    name: Windows Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build MAUI Windows
        run: dotnet publish -c Release -f net10.0-windows10.0.19041.0 --no-restore

      - name: Upload Windows Artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: mauiblazor-windows-ci-build
          path: src/MauiBlazor.UI/MauiBlazor.UI.Mobile/bin/Release/net10.0-windows10.0.19041.0/win10-x64/publish/

  build-ios:
    runs-on: macos-14
    name: iOS Build
    defaults:
      run:
        working-directory: ./src/MauiBlazor.UI/MauiBlazor.UI.Mobile/
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build MAUI iOS
        run: dotnet build -c Release -f net10.0-ios --no-restore /p:buildForSimulator=True /p:packageApp=True /p:ArchiveOnBuild=False

      - name: Upload iOS Artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: mauiblazor-ios-ci-build
          path: src/MauiBlazor.UI/MauiBlazor.UI.Mobile/bin/Release/net10.0-ios/iossimulator-x64/*.app

  build-mac:
    runs-on: macos-14
    name: MacCatalyst Build
    defaults:
      run:
        working-directory: ./src/MauiBlazor.UI/MauiBlazor.UI.Mobile/
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build MAUI MacCatalyst
        run: dotnet publish -f:net10.0-maccatalyst -c:Release --no-restore

      - name: Upload MacCatalyst Artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: mauiblazor-macos-ci-build
          path: src/MauiBlazor.UI/MauiBlazor.UI.Mobile/bin/Release/net10.0-maccatalyst/maccatalyst-x64/publish/
